  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {

        e.target.tagName, String(e.target.src || e.target.href || ''));

    }

    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page

    // runtime minted, is another publisher document) and only ACCEPTS

:center;justify-content:space-between;gap:12px;flex-wrap:wrap\">\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n              <sc-for list=\"{{ ctypes }}\" as=\"ct\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ ct.onPick }}\" style=\"border-radius:999px;padding:8px 16px;font-weight:800;font-size:13.5px;border:1px solid {{ ct.border }};background:{{ ct.bg }};color:{{ ct.fg }};transition:all .2s\">{{ ct.label }}<\/button>\n              <\/sc-for>\n            <\/div>\n            <span dir=\"ltr\" style=\"display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:#047857;background:#ECFDF5;border:1px solid #A7F3D0;border-radius:999px;padding:6px 12px;unicode-bidi:isolate\"><span style=\"width:8px;height:8px;border-radius:50%;background:#0E9F6E;box-shadow:0 0 10px #34D399;animation:mlPulse 1.8s infinite\"><\/span>MCP · mcp.islamiccontent.org<\/span>\n          <\/div>\n          <textarea value=\"{{ prompt }}\" sc-camel-on-change=\"{{ onPrompt }}\" rows=\"3\" placeholder=\"{{ promptPlaceholder }}\" style=\"width:100%;font-size:19px;line-height:1.8;font-weight:600;color:#0F172A;background:#F8FAFF;border:1px solid #C7D5F5;border-radius:18px;padding:16px 18px;resize:vertical;outline:none\" style-focus=\"border-color:#2464EC;box-shadow:0 0 0 3px rgba(36,100,236,.15)\"><\/textarea>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n            <span style=\"font-size:13px;font-weight:700;color:#64748B\">أمثلة:<\/span>\n            <sc-for list=\"{{ examples }}\" as=\"ex\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ ex.onPick }}\" style=\"background:#F5F7FC;border:1px solid #E3E8F4;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13.5px;color:#475569;transition:all .2s\" style-hover=\"border-color:#2464EC;color:#2464EC\">{{ ex.label }}<\/button>\n            <\/sc-for>\n          <\/div>\n          <div style=\"display: >\n            <\/div>\n          <\/div>\n          <button sc-camel-on-click=\"{{ startCreate }}\" style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:12px;background:linear-gradient(135deg,#2464EC,#3B82F6);color:#fff;border:0;border-radius:999px;padding:16px 32px;font-weight:800;font-size:18px;box-shadow:0 12px 32px rgba(36,100,236,.4);transition:transform .2s\" style-hover=\"transform:translateY(-2px)\">أنشئ بمُنير <span style=\"display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2)\">✦<\/span><\/button>\n        <\/div>\n      <\/sc-if>\n\n      <!-- UPLOAD MODE -->\n      <sc-if value=\"{{ isUpload }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;margin-bottom:8px;animation:mlIn .6s ease both\">\n        <h2 style=\"margin:0;font-family:'ThmanyahDisplay',serif;font-weight:900;font-size:clamp(30px,4vw,44px);color:#070B1A\">ارفــع محتــواك<\/h2>\n        <p style=\"margin:0;font-size:17px;color:#64748B;font-weight:500\">ملفًا أو نصًّا — سيقوم مُنير بقراءته وتقطيعه وتصنيف محتواه تلقائيًا.<\/p>\n      <\/div>\n      <sc-if value=\"{{ notUploading }}\" hint-placeholder-val=\"{{ true }}\">\n        <button data-m=\"dropzone\" sc-camel-on-click=\"{{ pickFile }}\" style=\"background:#fff;border:2px dashed #B9C8EE;border-radius:28px;padding:64px 30px;display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;transition:all .25s;animation:mlIn .7s ease both\" style-hover=\"border-color:#2464EC;background:#F0F5FF;box-shadow:0 20px 50px rgba(36,100,236,.12)\">\n          <span style=\"width:84px;height:84px;border-radius:26px;background:linear-gradient(135deg,#2464EC,#4FD1FF);display:grid;place-items:center;color:#fff;font-size:36px;box-shadow:0 14px 34px rgba(36,100,236,.35);animation:mlFloat 4s ease-in-out infinite\">⇧<\/span>\n          <span style=\"font-size:22px;font-weight:800;colo   <sc-if value=\"{{ pasteOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#fff;border:1.5px solid #2464EC;border-radius:22px;padding:18px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 32px rgba(36,100,236,.12);animation:mlIn .25s ease both\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n              <span style=\"display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;color:#070B1A\"><span style=\"width:34px;height:34px;border-radius:10px;background:#EFF6FF;display:grid;place-items:center;color:#2464EC;font-size:16px\">✎<\/span>الصق نصّك هنا<\/span>\n              <button sc-camel-on-click=\"{{ closePaste }}\" style=\"border:0;background:transparent;color:#94A3B8;font-size:20px;line-height:1\" style-hover=\"color:#DC2626\">×<\/button>\n            <\/div>\n            <textarea value=\"{{ pasteText }}\" sc-camel-on-change=\"{{ onPasteText }}\" rows=\"7\" placeholder=\"الحمد لله رب العالمين… قال الله تعالى: ﴿…﴾ وقال النبي ﷺ: «…»\" style=\"width:100%;font-family:'ThmanyahText',serif;font-size:17px;line-height:1.9;color:#0F172A;background:#F8FAFF;border:1px solid #C7D5F5;border-radius:14px;padding:14px 16px;resize:vertical;outline:none\" style-focus=\"border-color:#2464EC;box-shadow:0 0 0 3px rgba(36,100,236,.12)\"><\/textarea>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap\">\n              <span style=\"font-size:13px;color:#64748B;font-weight:700\">{{ pasteCount }} كلمة · تُكتشف الآيات والأحاديث والمصطلحات تلقائيًا<\/span>\n              <div style=\"display:flex;gap:8px\">\n                <button sc-camel-on-click=\"{{ pasteSample }}\" style=\"border:1px solid #E3E8F4;background:#fff;border-radius:999px;padding:10px 16px;font-weight:800;font-size:13.5px;color:#475569\" style-hover=\"background:#F5F7FC\">نص تجريبي<\/button>\n                <button sc-camel-on-click=\"{{ subm
